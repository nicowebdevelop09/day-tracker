name: Build APK (Capacitor)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Installa dipendenze e compila l'app web
        run: |
          npm install
          npm run build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Prepara ed esegui il sync di Capacitor Android
        run: |
          if [ ! -d "android" ]; then
            npx cap add android
          fi
          npx cap sync android

      - name: Ripristina la chiave di firma fissa (per aggiornamenti in-place)
        run: |
          mkdir -p ~/.android
          if [ -n "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" ]; then
            echo "${{ secrets.DEBUG_KEYSTORE_BASE64 }}" | base64 -d > ~/.android/debug.keystore
            echo "Chiave fissa ripristinata: gli aggiornamenti manterranno i dati salvati."
          else
            echo "::warning::Nessun secret DEBUG_KEYSTORE_BASE64 impostato: verrà usata una chiave generata al volo, diversa ad ogni build."
          fi

      - name: Compila l'APK
        working-directory: android
        run: ./gradlew assembleDebug

      - name: Carica l'APK come artifact
        uses: actions/upload-artifact@v4
        with:
          name: day-tracker-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
