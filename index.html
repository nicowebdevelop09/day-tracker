<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
    <meta name="theme-color" content="#15161B" />
    <meta name="description" content="Traccia offline il tempo dedicato alle tue attività quotidiane." />
    <link rel="icon" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-192.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Day Tracker</title>
  </head>
  <body style="margin:0; background:#15161B;">
    <div id="root"></div>
    <script>
      window.addEventListener("error", function (e) {
        var root = document.getElementById("root");
        if (root && !root.hasChildNodes()) {
          root.innerHTML =
            '<div style="color:#EDE9DE;background:#15161B;min-height:100vh;padding:24px;font-family:sans-serif;font-size:14px;line-height:1.6;">' +
            '<b>Errore nel caricamento dell\'app</b><br><br>' +
            (e.message || "errore sconosciuto") +
            (e.filename ? "<br><small>" + e.filename + ":" + e.lineno + "</small>" : "") +
            '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
